experiment:
  system: kolmogorov2d
  display_name: 2D Kolmogorov Flow
  system_label: Re=200, nu=0.005, alpha=0.1, n_f=4
data_generation:
  spatial_resolution: 4096
  downsampling_factors:
  - 1
  simulation_times:
  - 5000
  sim_time: 5000
  time_step: 0.01
  domain_length: 6.283185307179586
  num_initial_conditions: 75
  save_dir: data
  train_data_path: data/kolmogorov2d_trainval.h5
  test_data_path: data/kolmogorov2d_test.h5
  reynolds_number: 200.0
  viscosity: 0.005
  linear_drag: 0.1
  forcing_wavenumber: 4
  grid_size: 64
  candidate_grid_sizes:
  - 32
  - 64
  data_dt: 0.01
  integration_dt: 0.005
  burn_in_time: 20.0
  saved_steps: 5000
  trainval_trajectories: 75
  independent_test_trajectories: 15
  integrator: RK4 pseudo-spectral
  dealiasing: 2/3 rule
model:
  d_model: 256
  nhead: 8
  num_layers: 3
  dim_feedforward: 1024
  dropout: 0.001
  ffn_activation: gelu
  output_head_activation: relu
  prediction_parameterization: state_increment
  decoder_head: state_conditioned_recurrent_increment
spatial_adapter:
  enabled: true
  grid_size: 64
  boundary_condition: periodic
  encoder: three_level_circular_conv
  decoder: three_level_circular_conv_upsampling
  local_dynamics: full_resolution_circular_conv_residual
  stability:
    time_homogeneous_decoder: true
    spectral_filter_fraction: 0.6666666666666666
    max_normalized_step: 0.15
    rms_ratio_min: 0.9975
    rms_ratio_max: 1.0025
    field_rms_min: 0.60
    field_rms_max: 1.35
easy_attention_sgu:
  alpha_noise_std: 0.01
lstm:
  hidden_size: 256
  num_layers: 3
  dropout_keep_prob: 0.995
  zoneout_keep_prob: 0.98
  residual_connections: false
  state_increment_prediction: true
  hidden_state_propagation: 600
  dtype: float32
training:
  model_type: easy_attention_sgu
  seq_len: 128
  pred_len: 100
  allowed_pred_lens:
  - 100
  stride: 1
  train_val_split: 0.8
  random_seed: 42
attention_training:
  training_mode: model_specific_closed_loop_curriculum
  block_curriculum:
  - start_epoch: 1
    end_epoch: 10
    num_blocks: 1
    loss_steps: 10
  - start_epoch: 11
    end_epoch: 20
    num_blocks: 1
    loss_steps: 25
  - start_epoch: 21
    end_epoch: 35
    num_blocks: 1
    loss_steps: 50
  - start_epoch: 36
    end_epoch: 60
    num_blocks: 1
    loss_steps: 100
  batch_size: 8
  batch_size_by_blocks:
    1: 8
  learning_rate: 0.0002
  num_epochs: 600
  weight_decay: 0.0001
  gradient_clip: 1.0
  early_stopping_patience: 300
  max_train_batches_per_epoch: 100
  max_val_batches_per_epoch: 20
  scheduler: cosine
  eta_min: 1.0e-06
  use_amp: false
  adaptive_early_stopping:
    max_epochs: 60
    minimum_epochs: 40
    patience_epochs: 10
    relative_min_delta: 0.002
    reset_on_rollout_improvement: true
    rollout_patience_epochs: 15
attention_training_by_model:
  easy_attention_sgu:
    training_mode: model_specific_closed_loop_curriculum
    learning_rate: 0.00012
    eta_min: 1.0e-05
    num_epochs: 100
    pointwise_steps_cap: 50
    max_train_batches_per_epoch: 60
    max_val_batches_per_epoch: 12
    block_curriculum:
    - {start_epoch: 1, end_epoch: 15, num_blocks: 1, loss_steps: 25}
    - {start_epoch: 16, end_epoch: 30, num_blocks: 1, loss_steps: 50}
    - {start_epoch: 31, end_epoch: 45, num_blocks: 1, loss_steps: 100}
    - {start_epoch: 46, end_epoch: 70, num_blocks: 2, loss_steps: 200}
    - {start_epoch: 71, end_epoch: 100, num_blocks: 4, loss_steps: 400}
    batch_size_by_blocks: {1: 8, 2: 4, 4: 2}
    adaptive_early_stopping:
      max_epochs: 100
      minimum_epochs: 95
      patience_epochs: 10
      relative_min_delta: 0.001
      reset_on_rollout_improvement: true
      rollout_patience_epochs: 25
  self_attention:
    training_mode: model_specific_closed_loop_curriculum
    learning_rate: 0.0001
    eta_min: 1.0e-05
    num_epochs: 100
    pointwise_steps_cap: 50
    max_train_batches_per_epoch: 60
    max_val_batches_per_epoch: 12
    block_curriculum:
    - {start_epoch: 1, end_epoch: 15, num_blocks: 1, loss_steps: 25}
    - {start_epoch: 16, end_epoch: 30, num_blocks: 1, loss_steps: 50}
    - {start_epoch: 31, end_epoch: 45, num_blocks: 1, loss_steps: 100}
    - {start_epoch: 46, end_epoch: 70, num_blocks: 2, loss_steps: 200}
    - {start_epoch: 71, end_epoch: 100, num_blocks: 4, loss_steps: 400}
    batch_size_by_blocks: {1: 8, 2: 4, 4: 2}
    adaptive_early_stopping:
      max_epochs: 100
      minimum_epochs: 95
      patience_epochs: 10
      relative_min_delta: 0.001
      reset_on_rollout_improvement: true
      rollout_patience_epochs: 25
lstm_training:
  training_mode: closed_loop_curriculum
  seq_len_by_ds:
    1: 128
  curriculum:
  - start_epoch: 1
    end_epoch: 20
    horizon: 10
    learning_rate: 0.0005
  - start_epoch: 21
    end_epoch: 50
    horizon: 20
    learning_rate: 0.0003
  - start_epoch: 51
    end_epoch: 100
    horizon: 50
    learning_rate: 0.0002
  - start_epoch: 101
    end_epoch: 250
    horizon: 100
    learning_rate: 0.0001
  batch_size: 32
  micro_batch_size_by_horizon:
    10: 32
    20: 32
    50: 16
    100: 8
  learning_rate: 0.0005
  h100_learning_rate: 0.0001
  eta_min: 2.0e-05
  num_epochs: 250
  weight_decay: 0.0
  gradient_clip: 0.5
  early_stopping_patience: 40
  max_batch_groups_per_epoch: 30
  spectral_entropy_ratio_threshold: 0.65
  use_amp: false
  adaptive_early_stopping:
    max_epochs: 135
    minimum_epochs: 115
    patience_epochs: 8
    relative_min_delta: 0.002
    reset_on_rollout_improvement: true
loss:
  type: mse
  horizon_weighting: uniform
  variance_weight: 0.2
  mean_weight: 0.01
  temporal_variance_weight: 0.0
  increment_weight: 0.0
  increment_energy_weight: 0.0
  spatial_spectrum_weight: 0.0
  kinetic_energy_weight: 0.0
  enstrophy_weight: 0.0
  spatial_mean_weight: 0.0
loss_by_model:
  easy_attention_sgu:
    variance_weight: 0.45
    mean_weight: 0.02
    temporal_variance_weight: 0.90
    increment_weight: 0.75
    increment_energy_weight: 3.50
    spatial_spectrum_weight: 0.25
    kinetic_energy_weight: 1.75
    enstrophy_weight: 1.00
    spatial_mean_weight: 0.25
  self_attention:
    variance_weight: 0.35
    mean_weight: 0.02
    temporal_variance_weight: 0.75
    increment_weight: 0.50
    increment_energy_weight: 3.0
    spatial_spectrum_weight: 0.20
    kinetic_energy_weight: 1.50
    enstrophy_weight: 0.75
    spatial_mean_weight: 0.20
  lstm:
    variance_weight: 0.15
    mean_weight: 0.01
    temporal_variance_weight: 0.25
    increment_weight: 1.0
    spatial_spectrum_weight: 0.03
rollout_validation:
  enabled: true
  every_epochs: 5
  forecast_steps: 1200
  late_window_steps: 200
  collapse_std_ratio_threshold: 0.8
  spectral_entropy_ratio_threshold: 0.75
prediction:
  total_pred_steps: 2000
  minimum_required_steps: 1200
  num_eval_trajectories: 15
  lyapunov_exponent: 1.0
  lyapunov_exponent_calibrated: false
  nrmse_plot_floor: 1.0e-10
  test_data_path: data/kolmogorov2d_test.h5
