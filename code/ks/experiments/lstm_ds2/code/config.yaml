data_generation:
  spatial_resolution: 64
  downsampling_factors: [16, 32]
  simulation_times: [10000]
  sim_time: 10000
  time_step: 0.1
  domain_length: 22.0
  num_initial_conditions: 100
  save_dir: 'data'

model:
  d_model: 256
  nhead: 8
  num_layers: 3
  dim_feedforward: 1024
  dropout: 0.001
  ffn_activation: "gelu"
  output_head_activation: "relu"

easy_attention_sgu:
  alpha_noise_std: 0.01

lstm:
  hidden_size: 256
  num_layers: 3
  dropout_keep_prob: 0.995
  zoneout_keep_prob: 0.98
  residual_connections: false
  hidden_state_propagation: 600
  dtype: "float32"

training:
  model_type: "easy_attention_sgu"
  seq_len: 128
  pred_len: 100
  allowed_pred_lens: [100, 120]
  stride: 1
  train_val_split: 0.8
  random_seed: 42

attention_training:
  batch_size: 32
  learning_rate: 0.0001
  num_epochs: 600
  weight_decay: 0.0001
  gradient_clip: 1.0
  early_stopping_patience: 300
  max_train_batches_per_epoch: 500
  max_val_batches_per_epoch: 100
  scheduler: "cosine"
  eta_min: 0.000001
  use_amp: false

lstm_training:
  training_mode: "closed_loop_curriculum"
  seq_len_by_ds:
    1: 128
    2: 128
    4: 128
    8: 128
    16: 128
    32: 256
  curriculum:
    - {start_epoch: 1, end_epoch: 20, horizon: 10, learning_rate: 0.0005}
    - {start_epoch: 21, end_epoch: 50, horizon: 20, learning_rate: 0.0003}
    - {start_epoch: 51, end_epoch: 100, horizon: 50, learning_rate: 0.0002}
    - {start_epoch: 101, end_epoch: 250, horizon: 100, learning_rate: 0.0001}
  batch_size: 64
  learning_rate: 0.0005
  h100_learning_rate: 0.0001
  eta_min: 0.00002
  num_epochs: 250
  weight_decay: 0.0
  gradient_clip: 0.5
  early_stopping_patience: 40
  max_batch_groups_per_epoch: 100
  spectral_entropy_ratio_threshold: 0.65
  use_amp: false

loss:
  type: "mse"
  horizon_weighting: "uniform"

rollout_validation:
  enabled: true
  every_epochs: 5
  forecast_steps: 1200
  late_window_steps: 200
  collapse_std_ratio_threshold: 0.5

prediction:
  total_pred_steps: 3000
  minimum_required_steps: 1200
  num_eval_trajectories: 100
  lyapunov_exponent: 0.043
  nrmse_plot_floor: 1.0e-10
  test_data_path: null
